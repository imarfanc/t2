    subject: "⚙️🗂️ configure(repo): scaffold project tooling, Claude config, and workspace defaults"
    body: "██████╗ ██████╗ ███╗   ██╗███████╗██╗ ██████╗\n ██╔════╝██╔═══██╗████╗  ██║██╔════╝██║██╔════╝\n ██║     ██║   ██║██╔██╗ ██║█████╗  ██║██║  ███╗\n ██║     ██║   ██║██║╚██╗██║██╔══╝  ██║██║   ██║\n ╚██████╗╚██████╔╝██║ ╚████║██║     ██║╚██████╔╝\n  ╚═════╝ ╚═════╝ ╚═╝  ╚═══╝╚═╝     ╚═╝ ╚═════╝\n\n| Area                                    | What changed                                             |\n|-----------------------------------------|----------------------------------------------------------|\n| 🤖 .agents/                             | Codex config (approval policy, sandbox, reasoning)       |\n| 🤖 .agents/skills/git-commit-ascii/     | git-commit-ascii skill for OpenAI/Codex agent            |\n| 🔧 .claude/                             | Hooks, MCP example, settings, statusline, skill files    |\n| 🎨 .vscode/                             | Extensions, launch config, sessions, editor settings     |\n| 📄 .gitattributes / .gitignore          | Git attribute rules and updated ignore patterns          |\n| 💅 .markdownlint.jsonc / .prettierrc    | Markdown lint and Prettier formatting configs            |\n| 📋 justfile                             | Task runner recipes                                      |\n| 📁 docs/ / scripts/ / tmp/             | Placeholder files for docs, scripts, and scratch area    |\n| 📝 README.md                            | Updated project readme                                   |\n\nInitial scaffolding commit wiring up Claude Code settings (hooks, MCP, statusline, skills),\nVS Code workspace config, Codex agent config, and formatting tooling — establishing the\nbaseline developer environment for this repository."
