history:
  - hash: "a3fbbd7"
    date: "2026-06-12"
    author: "imarfanc"
    subject: "🦀🌐 add(dir-scanner): web UI scanner app, archive TUI version"
    body: "███████╗ ██████╗ █████╗ ███╗   ██╗\n  ██╔════╝██╔════╝██╔══██╗████╗  ██║\n  ███████╗██║     ███████║██╔██╗ ██║\n  ╚════██║██║     ██╔══██║██║╚██╗██║\n  ███████║╚██████╗██║  ██║██║ ╚████║\n  ╚══════╝ ╚═════╝╚═╝  ╚═╝╚═╝  ╚═══╝\n\n| Area                          | What changed                                               |\n|-------------------------------|------------------------------------------------------------|\n| 🌐 APPS/dir-scanner-web/      | New Rust web app: scan server + static JS/CSS frontend     |\n| 📦 Archive/dir-scanner-tui/   | TUI version of the scanner archived                        |\n| 📦 Archive/1.1-one-md/        | Moved from docs/macOS-reset-26.6 (md-rendered guide)       |\n| 📄 docs/                      | Dropped md-guide link, tweaks to rust-install pages        |\n| 🏠 index.html                 | Homepage updated                                           |\n| ⚙️ justfile                   | New dir-scanner-tui / dir-scanner-web recipes              |\n| 📊 Admin/repo-info/           | Snapshot refresh                                           |\n\nThe directory scanner graduates from a terminal TUI to a web UI: a Rust HTTP\nserver (scan, report, payload modules) with a static frontend on :8011. The\nold TUI and the markdown-rendered guide move to Archive."
  - hash: "0357dd7"
    date: "2026-06-12"
    author: "imarfanc"
    subject: "📄🦀 expand(docs): inline full Rust install guide into static HTML"
    body: "██████╗ ██╗   ██╗███████╗████████╗\n  ██╔══██╗██║   ██║██╔════╝╚══██╔══╝\n  ██████╔╝██║   ██║███████╗   ██║\n  ██╔══██╗██║   ██║╚════██║   ██║\n  ██║  ██║╚██████╔╝███████║   ██║\n  ╚═╝  ╚═╝ ╚═════╝ ╚══════╝   ╚═╝\n\n| Area                                             | What changed                                                      |\n|--------------------------------------------------|-------------------------------------------------------------------|\n| 🦀 docs/macOS-reset-26.6/rust-install/index.html | Replaced JS markdown-loader with full inlined static HTML content |\n| 📊 Admin/repo-info/repo-info.yaml                | Updated snapshot (docs dir grew, new commit hash)                 |\n\nThe page previously loaded content dynamically from a tmp Markdown file via a fetch script — now the guide is fully inlined as static HTML with all code blocks, copy buttons, and sections. Removes the runtime dependency on the tmp file being present."
  - hash: "7e17f22"
    date: "2026-06-12"
    author: "imarfanc"
    subject: "🐍✨ add(scripts): CSS/HTML/Markdown formatters and justfile recipes"
    body: "███████╗ ██████╗ ██████╗ ███╗   ███╗ █████╗ ████████╗\n  ██╔════╝██╔═══██╗██╔══██╗████╗ ████║██╔══██╗╚══██╔══╝\n  █████╗  ██║   ██║██████╔╝██╔████╔██║███████║   ██║\n  ██╔══╝  ██║   ██║██╔══██╗██║╚██╔╝██║██╔══██║   ██║\n  ██║     ╚██████╔╝██║  ██║██║ ╚═╝ ██║██║  ██║   ██║\n  ╚═╝      ╚═════╝ ╚═╝  ╚═╝╚═╝     ╚═╝╚═╝  ╚═╝   ╚═╝\n\n| Area                             | What changed                                                          |\n|----------------------------------|-----------------------------------------------------------------------|\n| 🐍 scripts/format-css.py         | New uv script: compact CSS formatter (tinycss2, stable idempotent)   |\n| 🐍 scripts/format-html.py        | New uv script: compact HTML formatter (stdlib parser, tree-based)    |\n| 🐍 scripts/format-md.py          | New uv script: Markdown formatter (mdformat, GFM/tables/frontmatter) |\n| ⚙️  justfile                      | Added format-css, format-html, format-md recipes with --check        |\n| 🖥️  Admin/repo-info/repo-info.css | Reformatted with new CSS formatter (compact single-line rules)       |\n| 🌐 Admin/repo-info/repo-info.html | Reformatted with new HTML formatter (compact inline elements)        |\n| 📊 Admin/repo-info/repo-info.yaml | Updated snapshot (new scripts dir size, latest commit hash)          |\n| 🔧 .vscode/sessions.json          | Added generic \"just\" terminal session entry                          |\n\nThree new uv inline-script formatters for CSS, HTML, and Markdown — each supports\n`-i` (in-place) and `--check` (CI-safe) modes, runs idempotently, and reports\nresults via a rich table. The repo-info files are the first output of the new\nformatters being applied."
  - hash: "f1221ce"
    date: "2026-06-12"
    author: "imarfanc"
    subject: "📊✨ add(admin): repo-info dashboard, macOS reset docs, and VS Code cleanup"
    body: "██████╗  █████╗ ███████╗██╗  ██╗██████╗  ██████╗  █████╗ ██████╗ ██████╗\n  ██╔══██╗██╔══██╗██╔════╝██║  ██║██╔══██╗██╔═══██╗██╔══██╗██╔══██╗██╔══██╗\n  ██║  ██║███████║███████╗███████║██████╔╝██║   ██║███████║██████╔╝██║  ██║\n  ██║  ██║██╔══██║╚════██║██╔══██║██╔══██╗██║   ██║██╔══██║██╔══██╗██║  ██║\n  ██████╔╝██║  ██║███████║██║  ██║██████╔╝╚██████╔╝██║  ██║██║  ██║██████╔╝\n  ╚═════╝ ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝╚═════╝  ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝╚═════╝\n\n| Area                             | What changed                                                              |\n|----------------------------------|---------------------------------------------------------------------------|\n| 📊 Admin/repo-info/              | New dashboard: config.yaml, HTML/CSS/JS viewer, generated YAML snapshot  |\n| 🦀 server/src/repo_info.rs       | New module: scans repo tree, writes repo-info.yaml on server startup      |\n| 🦀 server/src/main.rs            | Wired in repo_info module                                                 |\n| 🍎 docs/macOS-reset-26.6/        | New macOS reset guide section with index, Rust install, and step pages    |\n| 🌐 index.html                    | Updated repo index with new section links                                 |\n| ⚙️  .vscode/settings.json        | Disabled all format-on-save / format-on-paste / format-on-type            |\n| 📁 Archive/                      | Moved .markdownlint.jsonc and .prettierrc.json here                       |\n| 📝 tmp/tmp-26.6.10/              | Scratch markdown files (go.md, rust.md, 1.1 _ one.md)                    |\n\nThe repo-info dashboard provides a live snapshot of the repo tree — file sizes, git history,\nand ignored paths — regenerated each time the server starts. Formatting configs archived since\nthis repo uses hand-crafted HTML/CSS that auto-formatters tend to mangle."
  - hash: "5051ea1"
    date: "2026-06-12"
    author: "imarfanc"
    subject: "🦀✨ launch(repo): add Rust file server, doc site, and TUI demo"
    body: "██████╗ ███████╗██████╗  ██████╗      ███████╗███████╗██████╗ ██╗   ██╗███████╗██████╗\n  ██╔══██╗██╔════╝██╔══██╗██╔═══██╗     ██╔════╝██╔════╝██╔══██╗██║   ██║██╔════╝██╔══██╗\n  ██████╔╝█████╗  ██████╔╝██║   ██║     ███████╗█████╗  ██████╔╝██║   ██║█████╗  ██████╔╝\n  ██╔══██╗██╔══╝  ██╔═══╝ ██║   ██║     ╚════██║██╔══╝  ██╔══██╗╚██╗ ██╔╝██╔══╝  ██╔══██╗\n  ██║  ██║███████╗██║      ╚██████╔╝     ███████║███████╗██║  ██║ ╚████╔╝ ███████╗██║  ██║\n  ╚═╝  ╚═╝╚══════╝╚═╝       ╚═════╝     ╚══════╝╚══════╝╚═╝  ╚═╝  ╚═══╝  ╚══════╝╚═╝  ╚═╝\n\n| Area                                        | What changed                                                              |\n|---------------------------------------------|---------------------------------------------------------------------------|\n| 🦀 server/src/main.rs                       | New static file server: keep-alive, TCP_NODELAY, pretty TUI banner        |\n| 🔍 server/src/debug.rs                      | Diagnostics module, toggled via REPO_SERVER_DEBUG env var                 |\n| 📦 server/Cargo.toml + Cargo.lock           | New Cargo project \"repo-server\" with colored, crossterm, serde            |\n| ⚙️  server/config.json                      | Server defaults (port 8008, request logging)                              |\n| 🌐 index.html                               | Repo index page linking the docs                                          |\n| 📄 docs/install-rust/index.html             | \"Installing Rust on a New Mac\" guide with copy buttons                    |\n| 📄 docs/single-file-rust-scripts/index.html | Single-file Rust scripts guide                                            |\n| 🎨 docs/_shared/code-highlight.{css,js}     | Shared syntax highlighter; fixed infinite-loop bug (missing g flag)       |\n| 🐛 docs/server-stall-debugging.md           | Debugging notes for keep-alive stall and regex infinite-loop root cause   |\n| 🖥️  scripts/test-tui/test.rs                | Shell/Rust polyglot Markdown TUI demo (no Cargo needed)                   |\n| 📝 scripts/test-tui/content.md              | TUI demo content                                                          |\n| 🔧 justfile                                 | Added serve, serve-debug, test-tui recipes; renamed default → _default    |\n| 🚫 .gitignore                               | Exclude builds/ directory                                                 |\n\nFirst working iteration of the repo — static file server serves the doc site from\nlocalhost:8008 with keep-alive, TCP_NODELAY, and a polished terminal banner. The\ncode-highlight.js infinite-loop bug (missing g flags on all regexes) was caught and\nfixed during server stall debugging."
