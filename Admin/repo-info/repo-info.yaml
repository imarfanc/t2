    subject: "🦀✨ launch(repo): add Rust file server, doc site, and TUI demo"
    body: "██████╗ ███████╗██████╗  ██████╗      ███████╗███████╗██████╗ ██╗   ██╗███████╗██████╗\n  ██╔══██╗██╔════╝██╔══██╗██╔═══██╗     ██╔════╝██╔════╝██╔══██╗██║   ██║██╔════╝██╔══██╗\n  ██████╔╝█████╗  ██████╔╝██║   ██║     ███████╗█████╗  ██████╔╝██║   ██║█████╗  ██████╔╝\n  ██╔══██╗██╔══╝  ██╔═══╝ ██║   ██║     ╚════██║██╔══╝  ██╔══██╗╚██╗ ██╔╝██╔══╝  ██╔══██╗\n  ██║  ██║███████╗██║      ╚██████╔╝     ███████║███████╗██║  ██║ ╚████╔╝ ███████╗██║  ██║\n  ╚═╝  ╚═╝╚══════╝╚═╝       ╚═════╝     ╚══════╝╚══════╝╚═╝  ╚═╝  ╚═══╝  ╚══════╝╚═╝  ╚═╝\n\n| Area                                        | What changed                                                              |\n|---------------------------------------------|---------------------------------------------------------------------------|\n| 🦀 server/src/main.rs                       | New static file server: keep-alive, TCP_NODELAY, pretty TUI banner        |\n| 🔍 server/src/debug.rs                      | Diagnostics module, toggled via REPO_SERVER_DEBUG env var                 |\n| 📦 server/Cargo.toml + Cargo.lock           | New Cargo project \"repo-server\" with colored, crossterm, serde            |\n| ⚙️  server/config.json                      | Server defaults (port 8008, request logging)                              |\n| 🌐 index.html                               | Repo index page linking the docs                                          |\n| 📄 docs/install-rust/index.html             | \"Installing Rust on a New Mac\" guide with copy buttons                    |\n| 📄 docs/single-file-rust-scripts/index.html | Single-file Rust scripts guide                                            |\n| 🎨 docs/_shared/code-highlight.{css,js}     | Shared syntax highlighter; fixed infinite-loop bug (missing g flag)       |\n| 🐛 docs/server-stall-debugging.md           | Debugging notes for keep-alive stall and regex infinite-loop root cause   |\n| 🖥️  scripts/test-tui/test.rs                | Shell/Rust polyglot Markdown TUI demo (no Cargo needed)                   |\n| 📝 scripts/test-tui/content.md              | TUI demo content                                                          |\n| 🔧 justfile                                 | Added serve, serve-debug, test-tui recipes; renamed default → _default    |\n| 🚫 .gitignore                               | Exclude builds/ directory                                                 |\n\nFirst working iteration of the repo — static file server serves the doc site from\nlocalhost:8008 with keep-alive, TCP_NODELAY, and a polished terminal banner. The\ncode-highlight.js infinite-loop bug (missing g flags on all regexes) was caught and\nfixed during server stall debugging."
