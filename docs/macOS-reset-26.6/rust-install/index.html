<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rust macOS Reset Guide</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 920px;
    margin: 0 auto;
    padding: 2rem 1.25rem 5rem;
    line-height: 1.6;
    color: CanvasText;
    background: Canvas;
  }
  h1 { border-bottom: 2px solid #ce422b; padding-bottom: .4rem; }
  h2 { margin-top: 2.5rem; color: #ce422b; }
  h3 { margin-top: 1.75rem; }
  a { color: #ce422b; }
  code {
    background: light-dark(#f4f4f4, #2a2a2a);
    padding: .15em .4em;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .9em;
  }
  pre {
    position: relative;
    max-height: 68vh;
    overflow: auto;
    padding: 1rem;
    border: 1px solid light-dark(#ddd, #444);
    border-radius: 8px;
    background: light-dark(#f0f0f0, #252525);
  }
  pre code {
    display: block;
    min-width: max-content;
    padding: 0;
    background: none;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
  }
  th, td {
    padding: .65rem .75rem;
    border: 1px solid light-dark(#d8d8d8, #484848);
    text-align: left;
    vertical-align: top;
  }
  th { background: light-dark(#f3f3f3, #292929); }
  .intro {
    border-left: 4px solid #ce422b;
    padding: .65rem 1rem;
    border-radius: 0 8px 8px 0;
    background: light-dark(rgba(206,66,43,.08), rgba(206,66,43,.18));
  }
  .copy-btn {
    position: sticky;
    z-index: 2;
    top: 6px;
    left: calc(100% - 64px);
    float: right;
    margin: -4px -4px 4px 8px;
    padding: 4px 8px;
    font: 11px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    border: 1px solid light-dark(#ccc, #555);
    border-radius: 4px;
    background: light-dark(#fff, #2f2f2f);
    color: light-dark(#444, #ccc);
    cursor: pointer;
    opacity: .8;
  }
  .copy-btn:hover { opacity: 1; }
  .copy-btn.copied {
    border-color: #4a9c5e;
    color: #4a9c5e;
    opacity: 1;
  }
  .loading, .error { padding: 2rem 0; }
  .error { color: #c33; }
</style>
<link rel="stylesheet" href="/docs/_shared/code-highlight.css">
</head>
<body>
<p><a href="/docs/macOS-reset-26.6/">← Back to macOS Reset 26.6</a></p>
<h1>🦀 Rust macOS Reset Guide</h1>
<p class="intro">Official rustup installation, terminal crates, and a complete Rust directory scanner. Every code block has a copy button.</p>
<main id="content"><p class="loading">Loading the Rust guide…</p></main>

<script>
(function () {
  const sourceUrl = '/tmp/tmp-26.6.10/rust.md';
  const content = document.getElementById('content');

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function inline(text) {
    let output = escapeHtml(text);
    output = output.replace(/`([^`]+)`/g, '<code>$1</code>');
    output = output.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    return output;
  }

  function renderTable(lines) {
    const rows = lines.map(line =>
      line.replace(/^\||\|$/g, '').split('|').map(cell => cell.trim())
    );
    const headers = rows[0];
    const body = rows.slice(2);
    return '<table><thead><tr>' +
      headers.map(cell => `<th>${inline(cell)}</th>`).join('') +
      '</tr></thead><tbody>' +
      body.map(row => '<tr>' +
        row.map(cell => `<td>${inline(cell)}</td>`).join('') +
        '</tr>').join('') +
      '</tbody></table>';
  }

  function renderMarkdown(markdown) {
    const lines = markdown.replace(/\r\n/g, '\n').split('\n');
    const output = [];
    let index = 0;
    let inFrontmatter = lines[0] === '---';
    let paragraph = [];
    let list = [];

    function flushParagraph() {
      if (paragraph.length) {
        output.push(`<p>${inline(paragraph.join(' '))}</p>`);
        paragraph = [];
      }
    }

    function flushList() {
      if (list.length) {
        output.push('<ul>' + list.map(item => `<li>${inline(item)}</li>`).join('') + '</ul>');
        list = [];
      }
    }

    while (index < lines.length) {
      const line = lines[index];

      if (inFrontmatter) {
        if (index > 0 && line === '---') inFrontmatter = false;
        index++;
        continue;
      }

      if (line.startsWith('```')) {
        flushParagraph();
        flushList();
        const language = line.slice(3).trim() || 'text';
        const code = [];
        index++;
        while (index < lines.length && !lines[index].startsWith('```')) {
          code.push(lines[index]);
          index++;
        }
        output.push(
          `<pre><code class="language-${escapeHtml(language)}">${escapeHtml(code.join('\n'))}</code></pre>`
        );
        index++;
        continue;
      }

      if (line.startsWith('|') && lines[index + 1] && /^\|\s*:?-+/.test(lines[index + 1])) {
        flushParagraph();
        flushList();
        const tableLines = [];
        while (index < lines.length && lines[index].startsWith('|')) {
          tableLines.push(lines[index]);
          index++;
        }
        output.push(renderTable(tableLines));
        continue;
      }

      const heading = line.match(/^(#{1,3})\s+(.+)$/);
      if (heading) {
        flushParagraph();
        flushList();
        const level = heading[1].length;
        if (level > 1) output.push(`<h${level}>${inline(heading[2])}</h${level}>`);
        index++;
        continue;
      }

      const bullet = line.match(/^\s*-\s+(.+)$/);
      if (bullet) {
        flushParagraph();
        list.push(bullet[1]);
        index++;
        continue;
      }

      if (!line.trim()) {
        flushParagraph();
        flushList();
      } else {
        flushList();
        paragraph.push(line.trim());
      }
      index++;
    }

    flushParagraph();
    flushList();
    return output.join('\n');
  }

  function addCopyButtons() {
    document.querySelectorAll('#content pre').forEach(pre => {
      const button = document.createElement('button');
      button.className = 'copy-btn';
      button.textContent = 'Copy';
      button.setAttribute('aria-label', 'Copy code to clipboard');

      button.addEventListener('click', async () => {
        const text = pre.querySelector('code').textContent;
        try {
          await navigator.clipboard.writeText(text);
        } catch (_) {
          const area = document.createElement('textarea');
          area.value = text;
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          area.remove();
        }

        button.textContent = 'Copied!';
        button.classList.add('copied');
        setTimeout(() => {
          button.textContent = 'Copy';
          button.classList.remove('copied');
        }, 1600);
      });

      pre.prepend(button);
    });
  }

  fetch(sourceUrl)
    .then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.text();
    })
    .then(markdown => {
      content.innerHTML = renderMarkdown(markdown);
      addCopyButtons();
      const highlighter = document.createElement('script');
      highlighter.src = '/docs/_shared/code-highlight.js';
      document.body.appendChild(highlighter);
    })
    .catch(error => {
      content.innerHTML = `<p class="error">Could not load the guide: ${escapeHtml(error.message)}</p>`;
    });
})();
</script>
</body>
</html>
