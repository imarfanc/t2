<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory Scanner Web</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Directory Scanner</h1>
    <div class="controls-row path-row">
      <input id="root" type="text" value="." spellcheck="false" aria-label="Scan root path">
      <button id="browse" type="button">Browse</button>
      <button id="scan" type="button">Scan</button>
      <button id="save" type="button" disabled>Save report</button>
    </div>
    <div class="controls-row ignore-row">
      <label class="field">
        <span>Ignore folders</span>
        <input id="ignore-dirs" type="text" value="target, builds" spellcheck="false" placeholder="target, builds" aria-label="Folders to ignore">
      </label>
      <label class="field">
        <span>Ignore files</span>
        <input id="ignore-files" type="text" value="Thumbs.db, .DS_Store" spellcheck="false" placeholder="Thumbs.db, .DS_Store" aria-label="Files to ignore">
      </label>
    </div>
    <p id="status">Enter a path and scan.</p>
  </header>
  <main>
    <nav class="tabs" id="tabs" aria-label="Result panels"></nav>
    <div id="panels"></div>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
