[package]
name = "dir-scanner-web"
version = "0.1.0"
edition = "2021"
description = "macOS reset directory scanner web UI"

[dependencies]
axum = "0.8"
chrono = "0.4"
colored = "2"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "trace"] }
unicode-width = "0.2"
